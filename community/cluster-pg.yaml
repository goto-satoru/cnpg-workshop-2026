---
apiVersion: v1
kind: Namespace
metadata:
  name: edb
---
apiVersion: v1
kind: Secret
metadata:
  name: backup-storage-creds
  namespace: edb
type: Opaque
stringData:
  ACCESS_KEY_ID: silo_admin
  SECRET_ACCESS_KEY: silo_passwd_1615
  AWS_REGION: us-east-1
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: example
  namespace: edb
spec:
  instances: 3
  #  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie
  storage:
    size: 1Gi

  backup:
    retentionPolicy: "1d" # Keep backups for 1 day
    barmanObjectStore:
      destinationPath: "s3://barman"
      endpointURL: "http://silo-minio.edb.svc.cluster.local:9000"
      s3Credentials:
        accessKeyId:
          name: backup-storage-creds
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: backup-storage-creds
          key: SECRET_ACCESS_KEY
      wal:
        compression: gzip
        maxParallel: 2
