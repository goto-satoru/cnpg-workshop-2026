apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: epas16-manual
  namespace: edb
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      k8s.enterprisedb.io/cluster: epas16
  podMetricsEndpoints:
  - port: metrics
    path: /metrics
    interval: 10s
    relabelings:
    - sourceLabels: [ __meta_kubernetes_namespace ]
      targetLabel: namespace
    - sourceLabels: [ __meta_kubernetes_pod_name ]
      targetLabel: pod
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: epas16-custom-queries
  namespace: edb
  labels:
    cnpg.io/reload: "true"
data:
  custom-queries.yaml: |
    pg_stat_activity_wait_events:
      query: |
        SELECT
          coalesce(wait_event_type, 'none') AS wait_event_type,
          coalesce(wait_event, 'none') AS wait_event,
          count(*) AS count
        FROM pg_stat_activity
        WHERE pid != pg_backend_pid()
        GROUP BY wait_event_type, wait_event
      metrics:
        - wait_event_type:
            usage: "LABEL"
            description: "Wait event category"
        - wait_event:
            usage: "LABEL"
            description: "Specific wait event"
        - count:
            usage: "GAUGE"
            description: "Number of backends in this wait state"

# Cluster side reference (apply to your CNPG Cluster spec):
# spec:
#   monitoring:
#     enablePodMonitor: true
#     customQueriesConfigMap:
#       - name: epas16-custom-queries
#         key: custom-queries.yaml
